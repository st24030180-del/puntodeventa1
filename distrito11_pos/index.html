<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de punto de venta de Distrito 11">
    <title>Distrito 11 | Punto de Venta</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header class="header">
        <div>
            <h1>DISTRITO <span>11</span></h1>
            <p>Punto de Venta</p>
        </div>

        <time id="fecha" datetime=""></time>
    </header>

    <nav class="nav" aria-label="Navegación principal">
        <button class="nav-btn active" type="button" onclick="mostrarSeccion('venta', this)">
            Venta
        </button>
        <button class="nav-btn" type="button" onclick="mostrarSeccion('pedidos', this)">
            Pedidos
        </button>
        <button class="nav-btn" type="button" onclick="mostrarSeccion('productos', this)">
            Productos
        </button>
    </nav>

    <main>
        <section id="venta" class="seccion activa" aria-labelledby="titulo-venta">
            <div class="venta-grid">
                <div class="menu-panel">
                    <div class="section-title">
                        <h2 id="titulo-venta">Menú</h2>
                    </div>

                    <div id="categorias" class="categorias" aria-label="Categorías de productos"></div>
                    <div id="productosVenta" class="productos-grid" aria-live="polite"></div>
                </div>

                <div class="pedido-panel">
                    <div class="section-title">
                        <h2>Pedido</h2>
                    </div>

                    <label for="mesa">Mesa</label>
                    <select id="mesa" name="mesa">
                        <option value="">Seleccionar mesa</option>
                        <option value="Mesa 1">Mesa 1</option>
                        <option value="Mesa 2">Mesa 2</option>
                        <option value="Mesa 3">Mesa 3</option>
                        <option value="Mesa 4">Mesa 4</option>
                        <option value="Mesa 5">Mesa 5</option>
                        <option value="Mesa 6">Mesa 6</option>
                        <option value="Mesa 7">Mesa 7</option>
                        <option value="Mesa 8">Mesa 8</option>
                        <option value="Mesa 9">Mesa 9</option>
                        <option value="Mesa 10">Mesa 10</option>
                        <option value="Mesa 11">Mesa 11</option>
                        <option value="Mesa 12">Mesa 12</option>
                        <option value="Para llevar">Para llevar</option>
                    </select>

                    <div id="carrito" class="carrito" aria-live="polite"></div>

                    <div class="total">
                        <span>Total</span>
                        <strong id="total">$0.00</strong>
                    </div>

                    <button class="btn-principal" type="button" onclick="guardarPedido()">
                        GUARDAR PEDIDO
                    </button>
                    <button class="btn-secundario" type="button" onclick="limpiarPedido()">
                        LIMPIAR
                    </button>
                </div>
            </div>
        </section>

        <section id="pedidos" class="seccion" aria-labelledby="titulo-pedidos">
            <div class="section-title">
                <h2 id="titulo-pedidos">Pedidos</h2>
                <strong id="ventasTotales">Ventas: $0.00</strong>
            </div>

            <div id="listaPedidos" class="pedidos-grid" aria-live="polite"></div>
        </section>

        <section id="productos" class="seccion" aria-labelledby="titulo-productos">
            <div class="section-title">
                <h2 id="titulo-productos">Administrar productos</h2>
            </div>

            <form class="form-producto" onsubmit="event.preventDefault(); guardarProducto();">
                <input type="hidden" id="productoId">

                <label class="sr-only" for="nombreProducto">Nombre del producto</label>
                <input id="nombreProducto" type="text" placeholder="Nombre del producto" autocomplete="off">

                <label class="sr-only" for="precioProducto">Precio</label>
                <input id="precioProducto" type="number" min="0.01" step="0.01" placeholder="Precio">

                <label class="sr-only" for="categoriaProducto">Categoría</label>
                <input id="categoriaProducto" type="text" placeholder="Categoría" autocomplete="off">

                <button class="btn-principal" type="submit">GUARDAR</button>
                <button class="btn-secundario" type="button" onclick="cancelarEdicion()">
                    CANCELAR
                </button>
            </form>

            <div id="listaProductosAdmin" class="admin-productos" aria-live="polite"></div>
        </section>
    </main>

    <script src="./localStorage.js"></script>
    <script src="./script.js"></script>
</body>

</html>
